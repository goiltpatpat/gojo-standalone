name: Release CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v2.2.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify tag matches pyproject.toml version
        run: |
          python3 - <<'PY'
          import os, tomllib
          tag = os.environ["RELEASE_TAG"].lstrip("v")
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          assert tag == version, f"Tag version {tag!r} != pyproject.toml version {version!r}"
          print(f"Version match verified: v{version}")
          PY
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}

      - name: Run lint and full test suite
        run: |
          ruff check gojo tests examples
          pytest tests -v

  build:
    name: Build Distribution Artifacts
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build & twine
        run: python3 -m pip install --upgrade pip build twine

      - name: Build sdist, wheel, and SHA256SUMS
        run: |
          python3 -m build
          twine check dist/*
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, build]
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          TAG_NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            if [ -n "$TAG_NOTES" ]; then
              gh release create "$TAG" dist/* \
                --title "Gojo Standalone ${TAG}" \
                --notes "$TAG_NOTES"
            else
              gh release create "$TAG" dist/* \
                --title "Gojo Standalone ${TAG}" \
                --generate-notes
            fi
          fi

  pypi-publish:
    name: Publish to PyPI (OIDC Trusted Publishing)
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/gojo-hn
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
