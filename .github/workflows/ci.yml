name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python3 -m pip install --upgrade pip ruff

      - name: Run ruff lint check
        run: ruff check gojo tests examples

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        run: pytest tests -v

      - name: Smoke-check CLI and package imports
        run: |
          python3 -m gojo.cli --help >/dev/null
          python3 -m gojo.cli radar --help >/dev/null
          python3 -m gojo.cli pulse --help >/dev/null
          python3 -c "import gojo, gojo.mcp_server; assert len(gojo.HN_AGENT_TOOL_DEFINITIONS) == 10"

  build:
    name: Build & Validate Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build & twine
        run: python3 -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python3 -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gojo-hn-dist
          path: dist/
          retention-days: 7
