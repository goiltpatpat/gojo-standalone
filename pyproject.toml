[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gojo-hn"
version = "1.0.0"
description = "Standalone production-grade Hacker News workflow and agent tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
]
mcp = [
    "mcp>=1.0.0",
]
docs = [
    "pypdf>=4.0.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
gojo-hn = "gojo.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
